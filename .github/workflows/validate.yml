name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate skill structure (frontmatter, links, agent interface)
        run: python3 scripts/validate_skill.py
      - name: Validate evaluation cases (schema v2)
        run: python3 evals/run_evals.py validate
      - name: Run evaluation-runner regression tests
        run: python3 -m unittest discover -s tests -v
